[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/src", "packages/lunar_core/src", "apps/api/tests", "packages/lunar_core/tests", "tests"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/lunar_core/tests", "tests/integration"]
addopts = "--import-mode=importlib -ra"
