[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-api"
version = "0.1.0"
description = "Lunar Navigator HTTP API"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["fastapi==0.121.0", "uvicorn==0.38.0", "lunar-core==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lunar_api = ["py.typed"]
